 copy[0]=`${eyebrow(p.role,0)}<h1 class="headline intro-name">${esc(p.name)}</h1><p class="role-line">${esc(p.role)}</p>${contactsHtml()}<div class="button-row"><button class="primary" data-go="1">${esc(s.begin)}${icon(lang==='ar'?'back':'arrow')}</button><button class="text-button" data-details="profile">${esc(s.profile)}${icon('expand')}</button></div>`;

 copy[3]=`${eyebrow(p.sections[2],3)}<h2 class="headline section-headline">${esc(p.sections[2])}</h2><div class="job-tabs" role="tablist" aria-label="${esc(p.sections[2])}">${['2021','2022','2023','2024','2025',p.jobs[5].label].map((y,i)=>`<button class="job-tab" id="job-tab-${i}" data-job="${i}" role="tab" aria-selected="${jobIndex===i}" aria-controls="job-panel" tabindex="${jobIndex===i?0:-1}">${esc(y)}</button>`).join('')}</div><div id="job-slot">${jobPanel()}</div><button class="details-cta" data-details="experience">${icon('expand')}<span><strong>${esc(s.allExperience)}</strong><small>${esc(s.clickDetails)}</small></span>${icon('arrow')}</button>`;

 const arts=[introArt,summaryArt,skillsArt,experienceArt,educationArt];
 $('stage').innerHTML=copy.map((c,i)=>`<section class="scene ${sceneIds[i]} ${i===1?'focus ':''}${active===i?'active':''}" id="scene-${sceneIds[i]}" data-index="${i}" aria-label="${esc(names[i])}" aria-hidden="${active!==i}" ${active!==i?'inert':''}><div class="copy">${c}</div>${i<5?`<div class="art" ${i===3?'':'aria-hidden="true"'}>${arts[i]()}</div>`:''}</section>`).join('');

}
function syncMobileChapters(){
 const select=$('mobile-chapter');if(!select)return;
 select.innerHTML=chapterNames().map((name,i)=>`<option value="${i}" ${i===active?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(name)}</option>`).join('');

function setButton(id,label,svg){$(id).innerHTML=icon(svg);$(id).setAttribute('aria-label',label);$(id).title=label}
function updateChrome(){syncMobileChapters();const s=t();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=d().name+' | '+(lang==='ar'?'عرض تفاعلي':'Interactive Profile');$('language').textContent=lang==='ar'?'EN':'عربي';$('language').setAttribute('aria-label',lang==='ar'?'Switch to English':'التبديل إلى العربية');$('hint').textContent=lang==='ar'?'السابق والتالي · الأسهم ← →':'Previous / Next · Arrow keys ← →';$('viewport').setAttribute('aria-label',lang==='ar'?'عرض تفاعلي':'Interactive presentation');$('chapters').setAttribute('aria-label',lang==='ar'?'أقسام الملف':'Profile sections');setButton('motion',moving?s.motionOn:s.motionOff,'motion');$('motion').setAttribute('aria-pressed',String(moving));setButton('autoplay',autoplay?s.pause:s.play,autoplay?'pause':'play');$('autoplay').setAttribute('aria-pressed',String(autoplay));setButton('fullscreen',document.fullscreenElement?s.exitFullscreen:s.fullscreen,document.fullscreenElement?'shrink':'expand');$('previous').innerHTML=icon('back')+'<span>'+esc(lang==='ar'?'السابق':'Previous')+'</span>';$('previous').setAttribute('aria-label',s.previous);$('previous').title=s.previous;setButton('close-dialog',s.close,'close');$('next').innerHTML='<span>'+esc(active===lastScene?s.restart:s.next)+'</span>'+icon('arrow');$('next').setAttribute('aria-label',active===lastScene?s.restart:s.next);$('previous').disabled=active===0;$('current').textContent=String(active+1).padStart(2,'0');$('total').textContent=String(sceneIds.length).padStart(2,'0');$('watermark').textContent=String(active+1).padStart(2,'0');$('original-footer').textContent=d().footer;document.body.classList.toggle('reduced-motion',!moving);document.body.classList.toggle('motion-enabled',moving);}
function announce(){$('status').textContent=`${t().slide} ${active+1} ${t().of} ${sceneIds.length}: ${chapterNames()[active]}`}
function resolveScene(hash){const aliases={focus:'summary',learning:'education',systems:'experience',contact:'intro'};return sceneIds.indexOf(aliases[hash]||hash);}
function go(index,{manual=true}={}){
 if(!Number.isInteger(index)||index<0||index>lastScene||index===active||$('details').open)return false;
 if(manual&&autoplay)setAutoplay(false);

  scene.getAnimations().forEach(animation=>animation.cancel());
  scene.classList.remove('active','backward','departed','entering','leaving');
  scene.style.removeProperty('transform');scene.style.removeProperty('opacity');
  const current=scene===next;scene.classList.toggle('active',current);scene.inert=!current;scene.setAttribute('aria-hidden',String(!current));

  const animation=next.animate([{opacity:.35,transform:`translate3d(${direction*28}px,0,-100px) rotateY(${direction*-3}deg)`},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.22,.8,.2,1)',fill:'none'});
  entryAnimation=animation;animation.onfinish=()=>{if(entryAnimation===animation)entryAnimation=null;};

}
function selectJob(i,focus=false,fromCard=false){jobIndex=Math.max(0,Math.min(5,i));document.querySelectorAll('.job-tab').forEach((b,n)=>{b.setAttribute('aria-selected',String(n===jobIndex));b.tabIndex=n===jobIndex?0:-1});document.querySelectorAll('.journey-node').forEach((b,n)=>{b.classList.toggle('selected',n===jobIndex);b.setAttribute('aria-pressed',String(n===jobIndex));});$('job-slot').innerHTML=jobPanel();$('status').textContent=d().jobs[jIndexToSource(jobIndex)].title+' — '+d().jobs[jIndexToSource(jobIndex)].date;if(focus)$('job-tab-'+jobIndex).focus();if(fromCard&&innerWidth<=900){const scene=$('scene-experience');scene.scrollTo({top:scene.querySelector('.copy').offsetTop-20,behavior:moving?'smooth':'instant'});}}
function selectSkill(i){skillIndex=i;document.querySelectorAll('.skill-chip').forEach((b,n)=>b.setAttribute('aria-pressed',String(i===n)));document.querySelectorAll('.skill-tile').forEach(b=>b.classList.toggle('highlight',Number(b.dataset.tile)===i));}
function allJobs(){return d().jobs.map(j=>`<article class="detail-job">${jobMarkup(j)}</article>`).join('')}
function showDetails(type){if(autoplay)setAutoplay(false);lastFocused=document.activeElement;const p=d();$('dialog-title').textContent=type==='profile'?p.name:type==='experience'?p.sections[2]:p.sections[4];let body;if(type==='certifications')body=certList();else if(type==='experience')body=allJobs();else body=`<section class="dialog-section"><h3>${esc(p.role)}</h3>${contactsHtml()}</section><section class="dialog-section"><h3>${esc(p.sections[0])}</h3>${summaryHtml()}</section><section class="dialog-section"><h3>${esc(p.sections[1])}</h3><div class="modal-skills">${p.skills.map(n=>`<span>${esc(n)}</span>`).join('')}</div></section><section class="dialog-section"><h3>${esc(p.sections[2])}</h3>${allJobs()}</section><section class="dialog-section"><h3>${esc(p.sections[3])}</h3>${educationHtml()}</section><section class="dialog-section"><h3>${esc(p.sections[4])}</h3>${certList()}</section>`;$('dialog-body').innerHTML=body;$('details').showModal();$('dialog-body').scrollTop=0;$('close-dialog').focus();}
function closeDetails(){$('details').close();if(lastFocused?.isConnected)lastFocused.focus({preventScroll:true})}
function toast(msg){clearTimeout(toastTimer);$('toast').textContent=msg;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
function setAutoplay(value){autoplay=value;clearInterval(autoTimer);if(value){toast(t().autoToast);autoTimer=setInterval(()=>{if(document.hidden||$('details').open)return;if(active===lastScene){setAutoplay(false);return}go(active+1,{manual:false});},12000)}updateChrome();}
document.addEventListener('click',e=>{const goBtn=e.target.closest('[data-go]'),job=e.target.closest('[data-job]'),skill=e.target.closest('[data-skill]'),detail=e.target.closest('[data-details]');if(goBtn)go(+goBtn.dataset.go);else if(job){if(autoplay)setAutoplay(false);selectJob(+job.dataset.job,false,job.classList.contains('journey-node'));}else if(skill)selectSkill(+skill.dataset.skill);else if(detail)showDetails(detail.dataset.details);});
$('mobile-chapter')?.addEventListener('change',()=>{const select=$('mobile-chapter');if(!go(Number(select.value)))select.value=String(active);});
$('language').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';buildScenes();announce();});$('previous').addEventListener('click',()=>go(active-1));$('next').addEventListener('click',()=>go(active===lastScene?0:active+1));document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();go(0)});
$('motion').addEventListener('click',()=>{moving=!moving;if(!moving){entryAnimation?.cancel();entryAnimation=null;}if(!moving&&autoplay)setAutoplay(false);updateChrome();toast(moving?t().motionEnabledToast:t().motionToast);renderGeometry(performance.now());});$('autoplay').addEventListener('click',()=>setAutoplay(!autoplay));$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast(t().fullscreenFail)}});document.addEventListener('fullscreenchange',updateChrome);$('close-dialog').addEventListener('click',closeDetails);$('details').addEventListener('click',e=>{if(e.target===$('details')){const r=$('details').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDetails();}});$('details').addEventListener('cancel',e=>{e.preventDefault();closeDetails()});
document.addEventListener('keydown',e=>{if($('details').open||e.altKey||e.ctrlKey||e.metaKey)return;const el=document.activeElement;if(el?.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectJob(e.key==='Home'?0:e.key==='End'?5:(jobIndex+(e.key==='ArrowRight'?1:-1)+6)%6,true);return;}if(el?.closest('.scene')&&['BUTTON','A','INPUT','TEXTAREA','SELECT'].includes(el.tagName)&&['Enter',' '].includes(e.key))return;const section=document.querySelector('.scene.active');if(['ArrowDown','PageDown',' '].includes(e.key)&&section.scrollHeight>section.clientHeight+4&&section.scrollTop<section.scrollHeight-section.clientHeight-5){e.preventDefault();section.scrollBy({top:section.clientHeight*.7,behavior:moving?'smooth':'instant'});return;}if(['ArrowUp','PageUp'].includes(e.key)&&section.scrollTop>5){e.preventDefault();section.scrollBy({top:-section.clientHeight*.7,behavior:moving?'smooth':'instant'});return;}let index=null;if(['ArrowDown','PageDown',' '].includes(e.key))index=active+1;else if(['ArrowUp','PageUp'].includes(e.key))index=active-1;else if(e.key==='ArrowLeft')index=active+(lang==='ar'?1:-1);else if(e.key==='ArrowRight')index=active+(lang==='ar'?-1:1);else if(e.key==='Home')index=0;else if(e.key==='End')index=lastScene;if(index!==null){e.preventDefault();go(index)}});
let wheelSum=0,wheelTimer,wheelGestureUsed=false,wheelDirection=0;
document.addEventListener('wheel',e=>{
 if($('details').open||e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
 const direction=Math.sign(e.deltaY);if(!direction)return;
 if(direction!==wheelDirection){wheelSum=0;wheelGestureUsed=false;wheelDirection=direction;}
 clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelSum=0;wheelGestureUsed=false;wheelDirection=0;},200);
 const scene=document.querySelector('.scene.active'),max=scene.scrollHeight-scene.clientHeight;
 if(max>5&&((direction>0&&scene.scrollTop<max-5)||(direction<0&&scene.scrollTop>5))){wheelGestureUsed=true;return;}
 if((direction<0&&active===0)||(direction>0&&active===lastScene))return;
 e.preventDefault();if(wheelGestureUsed)return;

 if(Math.abs(wheelSum)>=45){wheelGestureUsed=true;wheelSum=0;go(active+direction);}
},{passive:false});
let touchStart=null;$('viewport').addEventListener('touchstart',e=>{if(e.target.closest('button,a'))return;const p=e.changedTouches[0];touchStart={x:p.clientX,y:p.clientY}},{passive:true});$('viewport').addEventListener('touchend',e=>{if(!touchStart)return;const p=e.changedTouches[0],dx=p.clientX-touchStart.x,dy=p.clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)go(active+(dx<0?1:-1));},{passive:true});
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!moving)return;pointerX=(e.clientX/innerWidth-.5)*2;pointerY=(e.clientY/innerHeight-.5)*2;const rig=document.querySelector('.scene.active .orbit-rig');if(rig)rig.style.transform=`translate(-50%,-50%) rotateX(${-16-pointerY*9}deg) rotateY(${-22+pointerX*12}deg)`;});

// Native canvas projects a rotating 3D point field; no third-party runtime is required.
const canvas=$('geometry'),ctx=canvas.getContext('2d');let cw=innerWidth,ch=innerHeight,dpr=Math.min(devicePixelRatio||1,2),lastFrame=0,frameId;
const points=Array.from({length:144},(_,i)=>{const u=i/143,v=i*2.3999632297;const phi=Math.acos(1-2*u);return{x:Math.sin(phi)*Math.cos(v),y:Math.cos(phi),z:Math.sin(phi)*Math.sin(v),u,v}});
function resizeCanvas(){cw=innerWidth;ch=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=cw*dpr;canvas.height=ch*dpr;ctx?.setTransform(dpr,0,0,dpr,0,0);if(!moving)renderGeometry(performance.now())}
function renderGeometry(time){if(!ctx)return;ctx.clearRect(0,0,cw,ch);const mobile=cw<=900,cx=mobile?cw*.5:(lang==='ar'?cw*.31:cw*.70),cy=mobile?ch*.28:ch*.47,r=Math.min(cw*(mobile?.28:.19),ch*.27),angle=moving?time*.000075:1.2;const a=Math.cos(angle),b=Math.sin(angle),proj=[];for(let i=0;i<points.length;i++){const p=points[i];let x=p.x,y=p.y,z=p.z;if(active===3){x=Math.cos(p.u*Math.PI*5)*.8;y=(p.u-.5)*2;z=Math.sin(p.u*Math.PI*5)*.8}else if(active===2){x=p.x*(1.1+.15*Math.sin(p.v));y=p.y*.8;z=p.z*.8}else if(active===4){x=Math.sign(p.x)*Math.abs(p.x)**.45;y=Math.sign(p.y)*Math.abs(p.y)**.45;z=Math.sign(p.z)*Math.abs(p.z)**.45}else if(active===5){const ring=p.u*Math.PI*2;x=Math.cos(ring);y=Math.sin(ring);z=Math.sin(p.v)*.15}const rx=x*a-z*b,rz=x*b+z*a,ry=y*Math.cos(.23)-rz*Math.sin(.23),zz=y*Math.sin(.23)+rz*Math.cos(.23),scale=3.4/(3.4+zz);proj.push({x:cx+(rx+pointerX*.04)*r*scale,y:cy+(ry+pointerY*.04)*r*scale,z:zz})}for(let i=0;i<proj.length;i++){const p=proj[i];const alpha=(1-p.z/2)*.26;ctx.fillStyle=`rgba(175,243,135,${alpha})`;ctx.beginPath();ctx.arc(p.x,p.y,p.z<0?1.45:.9,0,Math.PI*2);ctx.fill();for(let j=i+1;j<Math.min(proj.length,i+14);j++){const q=proj[j],distance=Math.hypot(p.x-q.x,p.y-q.y);if(distance<r*.27&&Math.abs(p.z-q.z)<.45){ctx.strokeStyle=`rgba(159,235,125,${(1-distance/(r*.27))*.075})`;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}}ctx.strokeStyle='#9fe7860c';ctx.beginPath();ctx.ellipse(cx,cy+r*.95,r*1.1,r*.19,0,0,Math.PI*2);ctx.stroke();}
function loop(time){if(time-lastFrame>32&&!document.hidden){if(moving)renderGeometry(time);lastFrame=time}frameId=requestAnimationFrame(loop)}
addEventListener('resize',resizeCanvas);matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{moving=!e.matches;if(!moving){entryAnimation?.cancel();entryAnimation=null;setAutoplay(false);}updateChrome();renderGeometry(performance.now())});
active=Math.max(0,resolveScene(location.hash.slice(1)));history.replaceState(null,'','#'+sceneIds[active]);buildScenes();resizeCanvas();renderGeometry(performance.now());requestAnimationFrame(loop);announce();
addEventListener('hashchange',()=>{const i=resolveScene(location.hash.slice(1));if(i>=0)go(i)});

// Match the actual visible viewport, including mobile browser bars.
function fitViewport(){
 const height=window.visualViewport?.height||window.innerHeight;
 document.documentElement.style.setProperty('--app-height',Math.round(height)+'px');
}
fitViewport();window.addEventListener('resize',fitViewport);window.visualViewport?.addEventListener('resize',fitViewport);
